  # === R-FILTER: Filters (13 rules) ===

  - id: R-FILTER-01
    family: R-FILTER
    name: "Categorical multi-select / single-select / exclude"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §5.3, §9.1"
      xml_element: "filter"
      xml_predicate: "@class='categorical' with groupfilter @function='union|exclude'"
    omni_target:
      spec_section: "Omni §9.1, §9.2"
      file_pattern: "dashboards/*.dashboard"
      yaml_path: "filters.<field>"
    default_mapping:
      strategy: omni_filter
      summary: "kind: STRING_IS plus values: [] plus optional is_negative: true."
      example: |
        sf_opportunities.stage_name:
          kind: STRING_IS
          type: string
          values: ["Closed Won", "Negotiation"]
          is_negative: false
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Filtered row count matches Tableau worksheet."
    notes: "Values exceeding wire size limit emit warning, recommend server-side filter view."

  - id: R-FILTER-02
    family: R-FILTER
    name: "Wildcard (contains, starts, ends, regex)"
    bucket: GREEN/YELLOW
    tableau_source:
      spec_section: "TWBX §5.3"
      xml_element: "filter"
      xml_predicate: "@class='wildcard' @match-pattern with criteria @match-type"
    omni_target:
      spec_section: "Omni §9.2"
      file_pattern: "dashboards/*.dashboard"
      yaml_path: "filters.<field>.kind"
    default_mapping:
      strategy: omni_filter
      summary: "Direct enum map. Regex kind on JSON wire side is GREY; verify via export."
      example: |
        view.name:
          kind: STRING_CONTAINS
          type: string
          values: ["example"]
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Pattern match count matches Tableau."
    notes: "Contains/starts/ends/exactly GREEN; regex YELLOW."

  - id: R-FILTER-03
    family: R-FILTER
    name: "Quantitative range"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §5.3"
      xml_element: "filter"
      xml_predicate: "@class='quantitative' @include-values='in-range' with min, max"
    omni_target:
      spec_section: "Omni §9.2"
      file_pattern: "dashboards/*.dashboard"
      yaml_path: "filters.<field>.kind"
    default_mapping:
      strategy: omni_filter
      summary: "kind: BETWEEN (inclusive) or WITHIN_RANGE."
      example: |
        view.amount:
          kind: BETWEEN
          type: number
          values: [1000, 50000]
          is_negative: false
    guardrails_consumed: []
    failure_mode: best_effort
    verification: "Filtered row count matches."
    notes: "Open-ended range uses GREATER_THAN_OR_EQUAL_TO or LESS_THAN_OR_EQUAL_TO."

  - id: R-FILTER-04
    family: R-FILTER
    name: "Date range (calendar)"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §5.3"
      xml_element: "filter"
      xml_predicate: "@class='quantitative' on date column with min, max"
    omni_target:
      spec_section: "Omni §9.2"
      file_pattern: "dashboards/*.dashboard"
      yaml_path: "filters.<field>.kind"
    default_mapping:
      strategy: omni_filter
      summary: "kind: WITHIN_RANGE, type: date. Direct."
      example: |
        view.closedate:
          kind: WITHIN_RANGE
          type: date
          values: ["2024-01-01", "2024-12-31"]
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Row count matches."
    notes: "Time zone ambiguity defaults to warehouse-local with warning if Tableau-set TZ differs."

  - id: R-FILTER-05
    family: R-FILTER
    name: "Relative date"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §5.3"
      xml_element: "filter"
      xml_predicate: "@class='relative-date' @first-period, @last-period, @period-type"
    omni_target:
      spec_section: "Omni §9.2"
      file_pattern: "dashboards/*.dashboard"
      yaml_path: "filters.<field>.kind"
    default_mapping:
      strategy: omni_filter
      summary: "Always TIME_FOR_INTERVAL_DURATION (the JSON form of YAML time_for_duration). The UI picker is chosen by the shape of left_side/right_side. Symmetric [N units ago, N units] renders as 'in the past N'. Asymmetric [offset ago, length] renders as offset range."
      example: |
        # last-period=0 case ("in the past 4 months"):
        view.closedate:
          kind: TIME_FOR_INTERVAL_DURATION
          type: date
          left_side: "4 months ago"
          right_side: "4 months"
          is_negative: false
        # last-period<0 case (offset window):
        view.closedate:
          kind: TIME_FOR_INTERVAL_DURATION
          type: date
          left_side: "6 months ago"
          right_side: "4 months"
          is_negative: false
    guardrails_consumed: []
    failure_mode: passthrough
    verification: "Relative window updates as expected; UI picker matches the Tableau 'Relative dates' dialog's intended shape."
    notes: |
      Date-literal semantics: "N units ago" resolves to INTERVAL '-(N-1) unit' truncated. "N complete units ago" resolves to INTERVAL '-N unit'. So [12 months ago, 12 months] covers 12 calendar months ending at the current month.
      Off-by-one trap: using abs(first) on the left (e.g. "11 months ago" for first=-11, last=0) yields the same data window but the wrong UI picker (range, not "in the past N"). Always emit period_count on both sides for the symmetric pattern.
      Do NOT emit TIME_FOR_UNIT_DURATION. The dashboards-filter PATCH API accepts it but the query planner rejects it with "Invalid literal value". Full date-kind enum surfaced via 400: IS_ON_DAY_OF_WEEK, IS_ON_DAY_OF_QUARTER, IS_IN_MONTH_OF_YEAR, IS_ON_DAY_OF_YEAR, IS_AT_HOUR_OF_DAY, IS_IN_QUARTER_OF_YEAR, IS_IN_WEEK_OF_YEAR, IS_ON_DAY_OF_MONTH, BETWEEN, ON_OR_AFTER, BEFORE, TIME_FOR_INTERVAL_DURATION, TIME_FOR_UNIT_DURATION, QUERY_OFFSET.

  - id: R-FILTER-06
    family: R-FILTER
    name: "Top-N filter"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §5.3"
      xml_element: "groupfilter"
      xml_predicate: "@function='end' @direction='TOP' @n"
    omni_target:
      spec_section: "Omni §7.1, §9"
      file_pattern: "views/*.view + dashboards/*.dashboard"
      yaml_path: "hidden rank dim + numeric filter"
    default_mapping:
      strategy: omni_filter
      summary: "Emit hidden rank dimension (R-CALC-09) plus a numeric LESS_THAN_OR_EQUAL_TO filter."
      example: |
        dimensions:
          customer_sales_rank:
            sql: RANK() OVER (ORDER BY ${TABLE}.total_sales DESC)
            type: number
            hidden: true
        # filters: { view.customer_sales_rank: { kind: LESS_THAN_OR_EQUAL_TO, values: [10] } }
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Result has exactly 10 rows."
    notes: "Calculated-measure ranking field materializes via derived_table."

  - id: R-FILTER-07
    family: R-FILTER
    name: "Conditional filter (formula-based)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §5.3"
      xml_element: "filter"
      xml_predicate: "@class='condition' with condition/expression"
    omni_target:

version: "1.0"
generated_from: tableau-omni-mapping-rules.md
source_spec_files:
  twbx: tableau-twbx-format-spec.md
  omni: omni-cli-format-spec.md
  audit: tableau-omni-parity-audit.md

# === User guardrails (mirrors the YAML block at the top of the markdown) ===
# 22 guardrails. Keys are stable IDs the rules engine looks up.
guardrails:

  lod_placement:
    default: model_layer
    options: [model_layer, workbook_layer, snowflake_view]
    affects_rules: [R-CALC-04, R-CALC-05, R-CALC-06]
    description: "Where Tableau LOD expressions land in the Omni stack. model_layer = Omni derived_table or measure SQL."

  calculated_field_placement:
    default: model_layer
    options: [model_layer, workbook_layer]
    affects_rules: [R-CALC-01, R-CALC-02, R-CALC-03]
    description: "Where ordinary calc fields land. model_layer keeps reuse high; workbook_layer is single-tile only."

  table_calc_placement:
    default: omni_table_calc
    options: [omni_table_calc, snowflake_window, workbook_layer]
    affects_rules: [R-CALC-07, R-CALC-08, R-CALC-09, R-CALC-10, R-CALC-11, R-CALC-12]
    description: "omni_table_calc when Omni supports the calc natively, snowflake_window otherwise."

  dual_axis_strategy:
    default: vega_lite_layered
    options: [vega_lite_layered, two_tiles_stacked, reject]
    affects_rules: [R-VIZ-10, R-VIZ-11]
    description: "Tableau dual-axis behavior. Vega-Lite handles synced and independent; two_tiles loses overlap."

  floating_zone_handling:
    default: snap_to_grid
    options: [snap_to_grid, reject_with_warning, best_effort_layered]
    affects_rules: [R-DASH-02, R-DASH-03]
    description: "Tableau floating layout has no Omni equivalent; choose how to land it."

  multi_tab_handling:
    default: separate_dashboards
    options: [separate_dashboards, single_dashboard_with_anchor, wait_for_omni_tabs]
    affects_rules: [R-DASH-09, R-DASH-10]
    description: "Tableau stories or multi-sheet dashboards. separate_dashboards is the safest until Omni tabs are stable."

  parameter_handling:
    default: omni_control
    options: [omni_control, snowflake_session_var, reject]
    affects_rules: [R-PARAM-01, R-PARAM-02, R-PARAM-03, R-PARAM-04]
    description: "Tableau parameters. omni_control = templated filter + dashboard control."

  set_handling:
    default: dimension_flag
    options: [dimension_flag, filter_preset, reject]
    affects_rules: [R-DERIVED-01, R-DERIVED-02, R-DERIVED-03]
    description: "Tableau sets. dimension_flag = CASE WHEN boolean dimension."

  group_handling:
    default: case_when_dimension
    options: [case_when_dimension, alias_only, reject]
    affects_rules: [R-DERIVED-04]
    description: "Tableau groups (categorical-bin)."

  bin_handling:
    default: omni_bin
    options: [omni_bin, case_when_dimension]
    affects_rules: [R-DERIVED-05]
    description: "Numeric bin: arithmetic FLOOR vs CASE ranges. omni_bin emits FLOOR."

  hierarchy_handling:
    default: omni_drill_fields
    options: [omni_drill_fields, flatten, reject]
    affects_rules: [R-DERIVED-06]
    description: "Tableau drill-paths."

  custom_palette_handling:
    default: emit_brand_theme
    options: [emit_brand_theme, inline_per_tile, reject]
    affects_rules: [R-COLOR-01, R-COLOR-02, R-COLOR-03]
    description: "emit_brand_theme writes one palette in model AI settings, then references per tile."

  tooltip_handling:
    default: omni_tooltip
    options: [omni_tooltip, drop_with_warning]
    affects_rules: [R-VIZ-20, R-FORMAT-08]
    description: "Tableau tooltip text with field tokens."

  forecast_cluster_handling:
    default: drop_with_warning
    options: [precompute_snowflake, drop_with_warning, reject]
    affects_rules: [R-VIZ-15, R-VIZ-16, R-CALC-13]
    description: "Tableau forecast / cluster analytics objects. Precompute is heavy; drop is honest."

  set_action_handling:
    default: drop_with_warning
    options: [drop_with_warning, reject_workbook]
    affects_rules: [R-ACTION-06]
    description: "Tableau set actions have no Omni equivalent."

  highlight_action_handling:
    default: drop_with_warning
    options: [drop_with_warning, crossfilter_substitute]
    affects_rules: [R-ACTION-02]
    description: "Tableau highlight actions."

  format_string_dialect:
    default: best_effort
    options: [omni_native, passthrough_excel, best_effort]
    affects_rules: [R-FORMAT-01, R-FORMAT-02, R-FORMAT-03]
    description: "best_effort uses Omni named formats when available, falls back to Excel-style strings."

  null_handling:
    default: preserve
    options: [preserve, replace_with_zero, drop]
    affects_rules: [R-FIELD-04]
    description: "Default null treatment for numeric measures."

  default_aggregation_strategy:
    default: respect_tableau
    options: [respect_tableau, force_explicit_in_omni]
    affects_rules: [R-FIELD-02, R-FIELD-03]
    description: "respect_tableau copies the TWBX default-aggregation enum onto the Omni measure."

  view_naming_convention:
    default: root_path_no_schema_prefix
    options: [root_path_no_schema_prefix, schema_prefixed, both]
    affects_rules: [R-CONN-01, R-MODEL-01]
    description: "PUBLIC views go at views/<view>.view; non-PUBLIC get schema__view filename."

  topic_naming_convention:
    default: snake_case_clean
    options: [from_tableau_datasource_caption, snake_case_clean, manual]
    affects_rules: [R-MODEL-05]
    description: "How to name the Omni topic. snake_case_clean strips Tableau adornments."

  fidelity_threshold_for_rejection:
    default: 0.6
    options: "float 0.0 - 1.0"
    affects_rules: [ALL]
    description: "Per-tile fidelity score. Below this the emitter raises instead of emitting low-quality output."

# === Mapping rules ===
# 129 rules across 14 families.
rules:

  # === R-CONN: Connections and datasources (8 rules) ===

  - id: R-CONN-01
    family: R-CONN
    name: "Live SQL connection"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.2"
      xml_element: "connection"
      xml_predicate: "@class, @dbname, @schema, @server, @warehouse attributes"
    omni_target:
      spec_section: "Omni §1.1, §2"
      file_pattern: "views/*.view"
      yaml_path: "schema, sql_table_name"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Emit one view file per Tableau column group. dbname.schema.table reconstructs sql_table_name. Omni connection must exist on target instance by name; emitter validates via omni connections list."
      example: |
        view: orders
        schema: PUBLIC
        sql_table_name: ANALYTICS.PUBLIC.ORDERS
    guardrails_consumed: [view_naming_convention]
    failure_mode: manual_review
    verification: "omni connections list shows the target connection; row count of view matches Tableau extract row count."
    notes: "Failure mode is connection not found on target Omni instance; emit error, list candidate connections, halt."

  - id: R-CONN-02
    family: R-CONN
    name: "Embedded Hyper extract"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §1.3, §3.12, §10"
      xml_element: "extract"
      xml_predicate: "@enabled='true' plus Data/*.hyper file in TWBX zip"
    omni_target:
      spec_section: "Omni §2"
      file_pattern: "n/a"
      yaml_path: "none native"
    default_mapping:
      strategy: precompute_upstream
      summary: "Re-point to the live underlying connection. If unknown or inaccessible, materialize the .hyper as a warehouse table upstream and target that table."
      example: |
        # No Omni native target. Re-point to the live source,
        # or materialize the .hyper upstream then apply R-CONN-01.
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Row count of resulting Omni view matches hyper extract."
    notes: "If underlying connection unrecoverable, emit warning, include hyper extraction script in migration report."

  - id: R-CONN-03
    family: R-CONN
    name: "Legacy TDE extract"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §1.1"
      xml_element: ".tde file"
      xml_predicate: "file extension .tde"
    omni_target:
      spec_section: "Omni §2"
      file_pattern: "n/a"
      yaml_path: "none native"
    default_mapping:
      strategy: precompute_upstream
      summary: "Upgrade .tde to .hyper using Tableau tdsutil before migration, then apply R-CONN-02."
      example: |
        # Step 1: tdsutil upgrade datasource.tde -> datasource.hyper
        # Step 2: apply R-CONN-02 (embedded hyper extract).
    guardrails_consumed: []
    failure_mode: reject
    verification: "Hyper file produced before migration proceeds."
    notes: ".tde upgrade failure halts with explicit message naming the workbook."

  - id: R-CONN-04
    family: R-CONN
    name: "Federated multi-connection"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.2"
      xml_element: "datasource"
      xml_predicate: "multiple connection siblings under one datasource"
    omni_target:
      spec_section: "Omni §2, §4"
      file_pattern: "topics/*.topic"
      yaml_path: "one topic per connection"
    default_mapping:
      strategy: manual_review
      summary: "Emit one Omni topic per connection plus a warning recommending an upstream join view. Do not attempt cross-connection join in Omni."
      example: |
        # topic_a.topic -> connection A
        # topic_b.topic -> connection B
        # Recommend upstream UNION view in warehouse.
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Each topic queries independently; cross-connection worksheets land in the warnings report."
    notes: "Cross-connection joins in worksheets demote to R-CONN-05."

  - id: R-CONN-05
    family: R-CONN
    name: "Cross-database join (federated 10.0+)"
    bucket: RED
    tableau_source:
      spec_section: "TWBX §1.5, §3.2"
      xml_element: "relation"
      xml_predicate: "@type='join' across connections"
    omni_target:
      spec_section: "Omni §4, §5"
      file_pattern: "n/a"
      yaml_path: "none (single-connection only)"
    default_mapping:
      strategy: drop_with_warning
      summary: "Emit a warning naming the source connections and the join predicate. Suggest: pre-join in warehouse and re-point Omni at the joined table. Do not attempt to emit Omni YAML for these joins."
      example: |
        # WARNING: cross-database join detected.
        # Pre-join in warehouse: CREATE VIEW joined AS
        #   SELECT ... FROM conn_a.t1 JOIN conn_b.t2 ON ...
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Warning appears in migration report for every affected worksheet."
    notes: "RED is absolute. No guardrail can override."

  - id: R-CONN-06
    family: R-CONN
    name: "Data blending"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.14"
      xml_element: "datasource-dependencies"
      xml_predicate: "linking primary and secondary datasources"
    omni_target:
      spec_section: "Omni §4, §5"
      file_pattern: "views/*.view"
      yaml_path: "derived_table.sql"
    default_mapping:
      strategy: derived_table_cte
      summary: "Emit a derived_table view that performs the blend in SQL, then reference it. Treat the linking field as the join key."
      example: |
        view: blended
        derived_table:
          sql: |
            SELECT p.*, s.metric
            FROM primary p
            LEFT JOIN secondary s ON p.link_key = s.link_key
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Row count of blended view equals row count of Tableau-blended worksheet."
    notes: "If linking field is calculated on-the-fly in the worksheet, emit warning and recommend manual SQL."

  - id: R-CONN-07
    family: R-CONN
    name: "Published-on-server datasource (sqlproxy)"
    bucket: GREY
    tableau_source:
      spec_section: "TWBX §3.2"
      xml_element: "connection"
      xml_predicate: "@class='sqlproxy', @server, @username"
    omni_target:
      spec_section: "Omni §2"
      file_pattern: "model.yaml"
      yaml_path: "extends"
    default_mapping:
      strategy: model_layer_dimension
      summary: "If a corresponding Omni shared model exists, emit extends: <model_id> in the workbook model file. If not, emit a warning."
      example: |
        extends: shared_finance_model_v3
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Workbook opens and inherits fields from the shared model."
    notes: "Halt unless --allow-orphan-extends flag passed when no matching shared model on Omni instance."

  - id: R-CONN-08
    family: R-CONN
    name: "Extract refresh schedule"
    bucket: RED
    tableau_source:
      spec_section: "TWBX §3.12"
      xml_element: "extract/refresh-schedule"
      xml_predicate: "presence"
    omni_target:
      spec_section: "Omni §2"
      file_pattern: "n/a"
      yaml_path: "none (refresh in warehouse)"
    default_mapping:
      strategy: drop_with_warning
      summary: "Emit a warning that refresh logic must move to dbt or the warehouse scheduler. Include the original Tableau schedule string in the warning."
      example: |
        # WARNING: extract refresh schedule '<original>' cannot be migrated.
        # Move refresh into dbt cloud job or warehouse scheduler.
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Warning appears in migration report."

  # === R-MODEL: Semantic model (6 rules) ===

  - id: R-MODEL-01
    family: R-MODEL
    name: "Physical inner / left / right / full join"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.3"
      xml_element: "relation"
      xml_predicate: "@type='join' @join='inner|left|right|full'"
    omni_target:
      spec_section: "Omni §5"
      file_pattern: "relationships.yaml"
      yaml_path: "relationships[]"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Map join enum directly; serialize expression tree to on_sql: Mustache string."
      example: |
        - join_from_view: orders
          join_to_view: customers
          join_type: always_left
          on_sql: ${orders.customer_id} = ${customers.id}
          relationship_type: many_to_one
    guardrails_consumed: [view_naming_convention]
    failure_mode: warn_and_drop
    verification: "Relationship resolves; sample joined query returns expected row count."
    notes: "If expression tree contains a function Omni cannot represent, materialize as a derived_table with warning."

  - id: R-MODEL-02
    family: R-MODEL
    name: "Multi-clause / calc-based join"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.3"
      xml_element: "clause"
      xml_predicate: "multi-expression body"
    omni_target:
      spec_section: "Omni §5"
      file_pattern: "relationships.yaml"
      yaml_path: "on_sql"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Walk every clause, render as ${left} = ${right}, join with AND."
      example: |
        on_sql: |
          ${orders.customer_id} = ${customers.id}
          AND ${orders.region} = ${customers.region}
    guardrails_consumed: []
    failure_mode: best_effort
    verification: "Relationship validates in Omni; join cardinality holds."
    notes: "Clause with Tableau-specific operator falls back to literal SQL with warning."

  - id: R-MODEL-03
    family: R-MODEL
    name: "Logical relationship (noodle)"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.4"
      xml_element: "relationship"
      xml_predicate: "first-end-point and second-end-point cardinality attrs"
    omni_target:
      spec_section: "Omni §5"
      file_pattern: "relationships.yaml"
      yaml_path: "relationship_type"
    default_mapping:
      strategy: model_layer_dimension
      summary: "many+one to many_to_one; one+one to one_to_one; many+many to many_to_many. join_type defaults to always_left."
      example: |
        - join_from_view: orders
          join_to_view: customers
          join_type: always_left
          relationship_type: many_to_one
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Relationship validates; row count post-join does not inflate."
    notes: "Cardinality unspecified defaults to many_to_one with warning."

  - id: R-MODEL-04
    family: R-MODEL
    name: "Custom SQL relation"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.3"
      xml_element: "relation"
      xml_predicate: "@type='text' with SQL body"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "sql or derived_table.sql"
    default_mapping:
      strategy: derived_table_cte
      summary: "XML-unescape body (TWBX 0.3), paste into the view sql: block, run a SQL formatter pass."
      example: |
        view: custom_orders
        sql: |
          SELECT o.id, o.amount
          FROM orders o
          WHERE o.created_at > '2024-01-01'
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Derived_table compiles in Omni; row count matches Tableau extract."
    notes: "SQL referencing a Tableau-only function emits warning and replaces with TODO marker."

  - id: R-MODEL-05
    family: R-MODEL
    name: "Topic naming and creation"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.1"
      xml_element: "datasource"
      xml_predicate: "@caption, @name"
    omni_target:
      spec_section: "Omni §4"
      file_pattern: "topics/*.topic"
      yaml_path: "base_view"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Emit <snake_case_clean caption>.topic with base_view set to the primary table. Strip Tableau adornments (federated, sqlproxy prefixes)."
      example: |
        topic: salesforce_crm
        base_view: sf_opportunities
    guardrails_consumed: [topic_naming_convention]
    failure_mode: best_effort
    verification: "Topic loads in Omni IDE."
    notes: "Empty or special-character caption falls back to name attribute."

  - id: R-MODEL-06
    family: R-MODEL
    name: "Union relation"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.3"
      xml_element: "relation"
      xml_predicate: "@type='union'"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "derived_table.sql"
    default_mapping:
      strategy: derived_table_cte
      summary: "Materialize as a derived_table with explicit UNION ALL between source tables, then reference."
      example: |
        view: unioned
        derived_table:
          sql: |
            SELECT * FROM source_2024
            UNION ALL
            SELECT * FROM source_2025
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Derived_table row count equals sum of source row counts."
    notes: "Diverging schemas across union sources emit warning naming the diverging columns."

  # === R-FIELD: Columns, dimensions, measures (7 rules) ===

  - id: R-FIELD-01
    family: R-FIELD
    name: "Column data type"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.5"
      xml_element: "column"
      xml_predicate: "@datatype='string|integer|real|date|datetime|boolean'"
    omni_target:
      spec_section: "Omni §3.3"
      file_pattern: "views/*.view"
      yaml_path: "dimension.type"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Lookup table: string to string, integer/real to number, date to date, datetime to timestamp, boolean to yesno."
      example: |
        # Tableau -> Omni
        # string   -> string
        # integer  -> number
        # real     -> number
        # date     -> date
        # datetime -> timestamp
        # boolean  -> yesno
    guardrails_consumed: []
    failure_mode: best_effort
    verification: "Omni view loads; dimension type matches."
    notes: "Datatype geometry or spatial demotes to R-FIELD-07."

  - id: R-FIELD-02
    family: R-FIELD
    name: "Dimension vs measure role"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.5"
      xml_element: "column"
      xml_predicate: "@role='dimension|measure'"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "dimensions vs measures section"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Place the field under the named section in the view YAML."
      example: |
        dimensions:
          region: { sql: ${TABLE}.REGION, type: string }
        measures:
          total_sales: { sql: ${TABLE}.AMOUNT, aggregate_type: sum }
    guardrails_consumed: [default_aggregation_strategy]
    failure_mode: best_effort
    verification: "Field appears in Omni's correct shelf."
    notes: "Role missing defaults to dimension for string/date, measure for numeric, with warning."

  - id: R-FIELD-03
    family: R-FIELD
    name: "Default aggregation"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.5"
      xml_element: "column"
      xml_predicate: "@aggregation='Sum|Avg|Count|CountD|Min|Max|Median|...'"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measure.aggregate_type"
    default_mapping:
      strategy: model_layer_measure
      summary: "Lookup: Sum to sum, Avg to average, Count to count, CountD to count_distinct, Min/Max/Median direct, Percentile to percentile."
      example: |
        # Tableau -> Omni
        # Sum         -> sum
        # Avg         -> average
        # Count       -> count
        # CountD      -> count_distinct
        # Min         -> min
        # Max         -> max
        # Median      -> median
        # Percentile  -> percentile
    guardrails_consumed: [default_aggregation_strategy]
    failure_mode: best_effort
    verification: "Aggregated measure value matches Tableau extract sum/avg/etc."
    notes: "Aggregation AttributeOf demotes to R-FIELD-05."

  - id: R-FIELD-04
    family: R-FIELD
    name: "Default format"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.5, §8.4"
      xml_element: "column"
      xml_predicate: "@default-format='c0|p1%|#,##0.00'"
    omni_target:
      spec_section: "Omni §3.4"
      file_pattern: "views/*.view"
      yaml_path: "format or value_format"
    default_mapping:
      strategy: format_string_best_effort
      summary: "Translate Tableau shortcuts to Excel-style strings via lookup. See R-FORMAT-02 for shortcut table."
      example: |
        measures:
          total_sales:
            sql: ${TABLE}.AMOUNT
            aggregate_type: sum
            format: "$#,##0"
    guardrails_consumed: [format_string_dialect, null_handling]
    failure_mode: best_effort
    verification: "Rendered cell value matches Tableau worksheet output."
    notes: "Format shortcut not in lookup table emits best-guess with warning."

  - id: R-FIELD-05
    family: R-FIELD
    name: "AttributeOf aggregation"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.5, §4.1"
      xml_element: "column"
      xml_predicate: "@aggregation='AttributeOf'"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql"
    default_mapping:
      strategy: model_layer_measure
      summary: "Emit SQL-driven measure with disagreement CASE."
      example: |
        measures:
          region_attr:
            sql: |
              CASE WHEN MIN(${TABLE}.region) = MAX(${TABLE}.region)
                   THEN MIN(${TABLE}.region) END
            type: string
    guardrails_consumed: []
    failure_mode: best_effort
    verification: "Rows that disagree return NULL, as in Tableau."

  - id: R-FIELD-06
    family: R-FIELD
    name: "Aliases (display-value remapping)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.7"
      xml_element: "aliases/alias"
      xml_predicate: "@key, @value pairs"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "dimensions.<name>.sql"
    default_mapping:
      strategy: alias_remap
      summary: "Dimension SQL with CASE WHEN remapping keys to display values."
      example: |
        dimensions:
          status_label:
            sql: |
              CASE ${TABLE}.STATUS
                WHEN 'A' THEN 'Active'
                WHEN 'I' THEN 'Inactive'
                ELSE ${TABLE}.STATUS
              END
            type: string
    guardrails_consumed: [group_handling]
    failure_mode: best_effort
    verification: "Distinct labels in Omni view match Tableau-displayed labels."
    notes: "ELSE branch preserves raw value when alias key not present in source data."

  - id: R-FIELD-07
    family: R-FIELD
    name: "Geometry / spatial data type"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.5"
      xml_element: "column"
      xml_predicate: "@datatype='geometry'"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "dimensions.<name>"
    default_mapping:
      strategy: passthrough
      summary: "Pass through as type: string. If a Vega-Lite map tile (R-VIZ-09) consumes the field, use it as the lookup key against a public TopoJSON."
      example: |
        dimensions:
          geom_field: { sql: ${TABLE}.GEOM, type: string }
    guardrails_consumed: []
    failure_mode: best_effort
    verification: "Shape renders in Vega-Lite or appears as text in tables."
    notes: "MAKEPOINT field with x/y components only is dropped or rewritten as separate lat/lng columns."

  # === R-CALC: Calculated fields, LOD, table calcs (17 rules) ===

  - id: R-CALC-01
    family: R-CALC
    name: "Arithmetic and math functions"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §4.1"
      xml_element: "calculation"
      xml_predicate: "@class='tableau' @formula='...'"
    omni_target:
      spec_section: "Omni §3.1"
      file_pattern: "views/*.view"
      yaml_path: "dimensions or measures sql"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Direct paste of formula body after token translation. [Field] to ${TABLE}.field or ${view.field} depending on cross-view reference."
      example: |
        dimensions:
          profit_margin:
            sql: (${TABLE}.PROFIT / NULLIF(${TABLE}.SALES, 0))
            type: number
    guardrails_consumed: [calculated_field_placement]
    failure_mode: reject
    verification: "Computed value matches Tableau extract for sample rows."
    notes: "Undefined token reference halts with explicit message."

  - id: R-CALC-02
    family: R-CALC
    name: "Logical (IF, IIF, CASE)"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §4.2"
      xml_element: "calculation"
      xml_predicate: "IF/IIF/CASE formula body"
    omni_target:
      spec_section: "Omni §3.1"
      file_pattern: "views/*.view"
      yaml_path: "dimensions/measures sql"
    default_mapping:
      strategy: case_when_dimension
      summary: "Mechanical rewrite to SQL CASE WHEN ... THEN ... ELSE ... END. IIF(a,b,c,d) requires WHEN a IS NULL THEN d branch."
      example: |
        dimensions:
          deal_tier:
            sql: |
              CASE
                WHEN ${TABLE}.AMOUNT >= 1000000 THEN 'Mega'
                WHEN ${TABLE}.AMOUNT >= 100000  THEN 'Large'
                ELSE 'Small'
              END
            type: string
    guardrails_consumed: [calculated_field_placement]
    failure_mode: best_effort
    verification: "Branch coverage tested against representative rows."
    notes: "Nested IF deeper than 8 levels emits legibility warning but proceeds."

  - id: R-CALC-03
    family: R-CALC
    name: "String / date / type functions"
    bucket: GREEN/YELLOW
    tableau_source:
      spec_section: "TWBX §4.1"
      xml_element: "calculation"
      xml_predicate: "LEN/LEFT/UPPER/DATEPART/DATETRUNC..."
    omni_target:
      spec_section: "Omni §3.1, §7.2"
      file_pattern: "views/*.view"
      yaml_path: "dimension_group.timeframes or sql"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Lookup table per warehouse dialect. Truncation prefers Omni timeframes."
      example: |
        # Tableau DATETRUNC('month', d) -> Omni dimension group
        dimension_group: order
        type: time
        timeframes: [date, week, month, quarter, year]
        sql: ${TABLE}.order_date
    guardrails_consumed: [calculated_field_placement]
    failure_mode: warn_and_drop
    verification: "Sample value comparison."
    notes: "Most functions GREEN; dialect-specific (e.g., ISOWEEK on no-ISO warehouse) YELLOW."

  - id: R-CALC-04
    family: R-CALC
    name: "LOD FIXED"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.6, §4.3"
      xml_element: "calculation"
      xml_predicate: "@formula contains '{ FIXED [dim] : ... }'"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "derived_table.sql + relationships"
    default_mapping:
      strategy: derived_table_cte
      summary: "Emit one view per unique (dim-list, agg-expr) pair as a derived_table CTE, then a relationship."
      example: |
        views:
          customer_total_sales:
            derived_table:
              sql: |
                SELECT customer_id AS customer, SUM(sales) AS customer_total_sales
                FROM orders
                GROUP BY customer_id
        relationships:
          - join_from_view: orders
            join_to_view: customer_total_sales
            join_type: always_left
            on_sql: ${orders.customer_id} = ${customer_total_sales.customer}
            relationship_type: many_to_one
    guardrails_consumed: [lod_placement]
    failure_mode: warn_and_drop
    verification: "Aggregated value at the fixed grain matches Tableau worksheet output."
    notes: "FIXED-dim list including row-dependent calc emits warning, recommend SQL window fallback."

  - id: R-CALC-05
    family: R-CALC
    name: "LOD INCLUDE"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.3"
      xml_element: "calculation"
      xml_predicate: "@formula contains '{ INCLUDE [dim] : ... }'"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql (window)"
    default_mapping:
      strategy: model_layer_measure
      summary: "SUM(...) OVER (PARTITION BY <viz_dims>, <include_dim>). Materialize at the most granular meaningful level."
      example: |
        measures:
          avg_profit_include_region:
            sql: |
              AVG(${TABLE}.profit) OVER (
                PARTITION BY ${TABLE}.region
              )
            type: number
    guardrails_consumed: [lod_placement]
    failure_mode: warn_and_drop
    verification: "Aggregated value matches Tableau output at the intended grain."
    notes: "Calculated include dim emits warning, falls back to derived_table."

  - id: R-CALC-06
    family: R-CALC
    name: "LOD EXCLUDE"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.3"
      xml_element: "calculation"
      xml_predicate: "@formula contains '{ EXCLUDE [dim] : ... }'"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql (window)"
    default_mapping:
      strategy: model_layer_measure
      summary: "SUM(...) OVER (PARTITION BY <viz_dims minus excluded_dim>). Same viz-dim caveat as R-CALC-05."
      example: |
        measures:
          sales_excl_region:
            sql: |
              SUM(${TABLE}.sales) OVER ()
            type: number
    guardrails_consumed: [lod_placement]
    failure_mode: warn_and_drop
    verification: "Same as R-CALC-05."

  - id: R-CALC-07
    family: R-CALC
    name: "Table calc RUNNING_*"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.5"
      xml_element: "table-calc"
      xml_predicate: "@agg-type='Sum' @ordering-type='Rows'"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql"
    default_mapping:
      strategy: model_layer_measure
      summary: "SQL window with ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW."
      example: |
        measures:
          running_total_sales:
            sql: |
              SUM(${TABLE}.sales) OVER (
                PARTITION BY {{ partition_field }}
                ORDER BY {{ order_field }}
                ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              )
            type: number
    guardrails_consumed: [table_calc_placement]
    failure_mode: warn_and_drop
    verification: "Cumulative sum at last row matches Tableau worksheet last-row value."

  - id: R-CALC-08
    family: R-CALC
    name: "Table calc WINDOW_*"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.5"
      xml_element: "table-calc"
      xml_predicate: "WINDOW_AVG/SUM(expr, from, to)"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql"
    default_mapping:
      strategy: model_layer_measure
      summary: "Map from/to integer attrs onto ROWS BETWEEN N PRECEDING AND M FOLLOWING."
      example: |
        measures:
          ma_12_sales:
            sql: |
              AVG(${TABLE}.sales) OVER (
                ORDER BY ${TABLE}.month
                ROWS BETWEEN 11 PRECEDING AND CURRENT ROW
              )
            type: number
    guardrails_consumed: [table_calc_placement]
    failure_mode: best_effort
    verification: "Spot-check at boundary rows."
    notes: "First/Last tokens translate via offsets relative to FIRST_VALUE / LAST_VALUE."

  - id: R-CALC-09
    family: R-CALC
    name: "Table calc RANK family"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §4.1, §4.5"
      xml_element: "calculation"
      xml_predicate: "RANK, RANK_DENSE, RANK_MODIFIED, RANK_PERCENTILE, RANK_UNIQUE"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql"
    default_mapping:
      strategy: model_layer_measure
      summary: "Direct SQL window mapping for each RANK variant."
      example: |
        # RANK            -> RANK() OVER (...)
        # RANK_DENSE      -> DENSE_RANK() OVER (...)
        # RANK_PERCENTILE -> PERCENT_RANK() OVER (...)
        # RANK_UNIQUE     -> ROW_NUMBER() OVER (...)
        # RANK_MODIFIED   -> custom COUNT(*) OVER (...)
    guardrails_consumed: [table_calc_placement]
    failure_mode: warn_and_drop
    verification: "Top-10 ranks match Tableau worksheet."
    notes: "RANK_MODIFIED across nulls emits warning, hand-roll SQL."

  - id: R-CALC-10
    family: R-CALC
    name: "Table calc INDEX / FIRST / LAST / SIZE / LOOKUP / TOTAL"
    bucket: YELLOW/GREEN
    tableau_source:
      spec_section: "TWBX §4.5"
      xml_element: "calculation"
      xml_predicate: "INDEX/FIRST/LAST/SIZE/LOOKUP/TOTAL"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql"
    default_mapping:
      strategy: model_layer_measure
      summary: "Direct SQL translation. ROW_NUMBER, FIRST_VALUE, LAST_VALUE, COUNT(*) OVER, LAG/LEAD, SUM() OVER ()."
      example: |
        # INDEX  -> ROW_NUMBER() OVER (...)
        # FIRST  -> negative offset to FIRST_VALUE
        # LAST   -> positive offset to LAST_VALUE
        # SIZE   -> COUNT(*) OVER (PARTITION BY ...)
        # LOOKUP -> LAG/LEAD
        # TOTAL  -> SUM(...) OVER ()
    guardrails_consumed: [table_calc_placement]
    failure_mode: warn_and_drop
    verification: "Spot-check at first, middle, last row."
    notes: "INDEX/FIRST/LAST/SIZE YELLOW; LOOKUP/TOTAL GREEN."

  - id: R-CALC-11
    family: R-CALC
    name: "Quick table calcs (% of total, difference, % difference, moving avg)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.5"
      xml_element: "calculation"
      xml_predicate: "@derivation='PercentOfTotal|Difference|...'"
    omni_target:
      spec_section: "Omni §3.2, §7.1"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql or pivot row_totals"
    default_mapping:
      strategy: model_layer_measure
      summary: "Prefer Omni native pivot row_totals for % of total; SQL window for everything else."
      example: |
        measures:
          pct_of_total_sales:
            sql: |
              SUM(${TABLE}.sales)
              / NULLIF(SUM(SUM(${TABLE}.sales)) OVER (PARTITION BY {{ partition_field }}), 0)
            type: number
    guardrails_consumed: [table_calc_placement]
    failure_mode: best_effort
    verification: "Column percentages sum to 100 percent per partition."
    notes: "NULLIF prevents division by zero."

  - id: R-CALC-12
    family: R-CALC
    name: "Custom table calc"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.5"
      xml_element: "calculation"
      xml_predicate: "@derivation='Custom' @formula='...'"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.sql"
    default_mapping:
      strategy: model_layer_measure
      summary: "Parse inner formula, rewrite arithmetic into window SQL."
      example: |
        measures:
          custom_window:
            sql: |
              SUM(${TABLE}.x) OVER (PARTITION BY ${TABLE}.group)
              - AVG(${TABLE}.x) OVER ()
            type: number
    guardrails_consumed: [table_calc_placement]
    failure_mode: warn_and_drop
    verification: "Sample value match."
    notes: "SCRIPT_* references demote to R-CALC-13."

  - id: R-CALC-13
    family: R-CALC
    name: "SCRIPT_* (R / Python integration)"
    bucket: RED
    tableau_source:
      spec_section: "TWBX §4.5"
      xml_element: "calculation"
      xml_predicate: "SCRIPT_REAL/INT/STR/BOOL"
    omni_target:
      spec_section: "n/a"
      file_pattern: "n/a"
      yaml_path: "none"
    default_mapping:
      strategy: drop_with_warning
      summary: "Emit warning naming the script body. Recommend dbt + Python or pre-compute upstream."
      example: |
        # WARNING: SCRIPT_REAL block dropped.
        # Recommend dbt python model or upstream pre-compute.
    guardrails_consumed: [forecast_cluster_handling]
    failure_mode: warn_and_drop
    verification: "Warning appears in migration report."

  - id: R-CALC-14
    family: R-CALC
    name: "Predictive (MODEL_PERCENTILE, MODEL_QUANTILE)"
    bucket: RED
    tableau_source:
      spec_section: "TWBX §4.1"
      xml_element: "calculation"
      xml_predicate: "MODEL_PERCENTILE/MODEL_QUANTILE"
    omni_target:
      spec_section: "n/a"
      file_pattern: "n/a"
      yaml_path: "none"
    default_mapping:
      strategy: drop_with_warning
      summary: "Emit warning. Recommend SNOWFLAKE.ML.FORECAST or BigQuery ML upstream."
      example: |
        # WARNING: MODEL_PERCENTILE dropped.
        # Recommend SNOWFLAKE.ML.FORECAST upstream.
    guardrails_consumed: [forecast_cluster_handling]
    failure_mode: warn_and_drop
    verification: "Warning appears."

  - id: R-CALC-15
    family: R-CALC
    name: "Spatial functions (MAKEPOINT, MAKELINE, DISTANCE, BUFFER, AREA)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.1"
      xml_element: "calculation"
      xml_predicate: "MAKEPOINT(lat,lng) etc."
    omni_target:
      spec_section: "Omni §3.1"
      file_pattern: "views/*.view"
      yaml_path: "dimensions.<name>.sql"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Dialect lookup, prefer ST_* (Snowflake / BigQuery / PostGIS)."
      example: |
        dimensions:
          point:
            sql: ST_MAKEPOINT(${TABLE}.LNG, ${TABLE}.LAT)
            type: string
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Distance / area values match a manual SQL query."
    notes: "Warehouse lacking spatial extension emits warning."

  - id: R-CALC-16
    family: R-CALC
    name: "HEXBINX / HEXBINY"
    bucket: RED
    tableau_source:
      spec_section: "TWBX §4.1"
      xml_element: "calculation"
      xml_predicate: "HEXBINX(x,y,size)"
    omni_target:
      spec_section: "n/a"
      file_pattern: "n/a"
      yaml_path: "none"
    default_mapping:
      strategy: drop_with_warning
      summary: "Emit warning. Pre-compute hex coordinates upstream."
      example: |
        # WARNING: HEXBINX dropped. Pre-compute hex bins upstream.
    guardrails_consumed: []
    failure_mode: warn_and_drop
    verification: "Warning appears."

  - id: R-CALC-17
    family: R-CALC
    name: "Forward references between calcs"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §4.4"
      xml_element: "calculation"
      xml_predicate: "[CaptionA] referenced inside Calc B defined earlier"
    omni_target:
      spec_section: "Omni §3.2"
      file_pattern: "views/*.view"
      yaml_path: "any field sql"
    default_mapping:
      strategy: model_layer_dimension
      summary: "Build a DAG, but emit fields in any order. Omni resolves ${field} lazily at compile time."
      example: |
        # Forward refs OK; Omni's compile-time resolution handles them.
    guardrails_consumed: []
    failure_mode: reject
    verification: "Omni view compiles."
    notes: "Circular reference halts with explicit cycle path."

  # === R-DERIVED: Groups, sets, bins, hierarchies (6 rules) ===

  - id: R-DERIVED-01
    family: R-DERIVED
    name: "Set (manual list)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.9"
      xml_element: "set/member/value"
      xml_predicate: "static value list"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "dimensions.<name> yesno"
    default_mapping:
      strategy: set_dimension_flag
      summary: "Boolean yesno dimension with IN (...)."
      example: |
        dimensions:
          is_in_top_customers:
            sql: |
              CASE WHEN ${TABLE}.customer_name IN ('Acme Inc','Globex') THEN true ELSE false END
            type: yesno
    guardrails_consumed: [set_handling]
    failure_mode: warn_and_drop
    verification: "Dimension boolean count matches Tableau set membership count."
    notes: "Set members > 1000 emit warning, recommend derived_table lookup."

  - id: R-DERIVED-02
    family: R-DERIVED
    name: "Set (condition-based)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.9"
      xml_element: "set/condition/expression"
      xml_predicate: "expression body"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "dimensions.<name> yesno"
    default_mapping:
      strategy: set_dimension_flag
      summary: "Boolean dimension with CASE WHEN <expr>."
      example: |
        dimensions:
          high_value:
            sql: |
              CASE WHEN ${TABLE}.amount > 10000 THEN true ELSE false END
            type: yesno
    guardrails_consumed: [set_handling]
    failure_mode: warn_and_drop
    verification: "Boolean count matches Tableau set."
    notes: "Aggregated field reference promotes to measure-level filter or demotes to R-DERIVED-03."

  - id: R-DERIVED-03
    family: R-DERIVED
    name: "Set (top-N)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.9"
      xml_element: "set/top"
      xml_predicate: "@n, @by, @direction='TOP'"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "hidden rank dim + topic filter"
    default_mapping:
      strategy: set_dimension_flag
      summary: "Emit hidden rank dimension and LESS_THAN_OR_EQUAL_TO filter at topic level. See R-FILTER-06 for filter shape."
      example: |
        dimensions:
          customer_sales_rank:
            sql: RANK() OVER (ORDER BY ${TABLE}.total_sales DESC)
            type: number
            hidden: true
    guardrails_consumed: [set_handling]
    failure_mode: warn_and_drop
    verification: "Top-10 rows in Omni match Tableau set members."

  - id: R-DERIVED-04
    family: R-DERIVED
    name: "Group (categorical-bin)"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.7"
      xml_element: "calculation"
      xml_predicate: "@class='categorical-bin' with bin/value children"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "dimensions.<name>.sql"
    default_mapping:
      strategy: case_when_dimension
      summary: "Dimension SQL with CASE WHEN ... IN (...) THEN."
      example: |
        dimensions:
          product_group:
            sql: |
              CASE
                WHEN ${TABLE}.PRODUCT_NAME IN ('Acme Widget','Acme Sprocket') THEN 'Acme Group'
                WHEN ${TABLE}.PRODUCT_NAME IN ('Globex Foo','Globex Bar') THEN 'Globex Group'
                ELSE ${TABLE}.PRODUCT_NAME
              END
            type: string
    guardrails_consumed: [group_handling]
    failure_mode: best_effort
    verification: "Distinct group labels match Tableau worksheet."
    notes: "Aliased value references resolve aliases first (R-FIELD-06), then group."

  - id: R-DERIVED-05
    family: R-DERIVED
    name: "Numeric bin"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.8"
      xml_element: "calculation"
      xml_predicate: "@class='bin' @column, @size"
    omni_target:
      spec_section: "Omni §3"
      file_pattern: "views/*.view"
      yaml_path: "dimensions.<name>.sql"
    default_mapping:
      strategy: bin_native
      summary: "Dimension FLOOR(x/size)*size."
      example: |
        dimensions:
          amount_bin:
            sql: FLOOR(${TABLE}.AMOUNT / 1000) * 1000
            type: number
    guardrails_consumed: [bin_handling]
    failure_mode: reject
    verification: "Bin counts match Tableau histogram."
    notes: "Size 0 or null halts."

  - id: R-DERIVED-06
    family: R-DERIVED
    name: "Hierarchy / drill-paths"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.11"
      xml_element: "drill-paths/drill-path/field"
      xml_predicate: "ordered field list"
    omni_target:
      spec_section: "Omni §3, §12"
      file_pattern: "views/*.view"
      yaml_path: "measures.<name>.drill_fields"
    default_mapping:
      strategy: hierarchy_drill_fields
      summary: "drill_fields: on measure plus ai_context mention."
      example: |
        measures:
          total_sales:
            aggregate_type: sum
            sql: ${TABLE}.amount
            drill_fields: [country, state, city, postal_code]
    guardrails_consumed: [hierarchy_handling]
    failure_mode: best_effort
    verification: "Drill click in Omni cycles through the hierarchy."
    notes: "Calculated drill dims must be promoted to real Omni dimensions first."

  # === R-PARAM: Parameters (4 rules) ===

  - id: R-PARAM-01
    family: R-PARAM
    name: "Parameter list domain"
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §3.10"
      xml_element: "parameter/domain"
      xml_predicate: "@type='list' with members"
    omni_target:
      spec_section: "Omni §9.6"
      file_pattern: "topics/*.topic"
      yaml_path: "filters.<name>"
    default_mapping:
      strategy: omni_control
      summary: "Topic-level templated filter with suggestion_list."
      example: |
        filters:
          region_param:
            type: string
            default_filter: West
            suggestion_list: [West, East, Central, South]
            display_order: 1
    guardrails_consumed: [parameter_handling]
    failure_mode: best_effort
    verification: "Omni dashboard control shows the same options."
    notes: "Dynamic member list from field demotes to free-form type: string."

  - id: R-PARAM-02
    family: R-PARAM
    name: "Parameter range domain"
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §3.10"
      xml_element: "parameter/domain"
      xml_predicate: "@type='range' @min, @max, @granularity"
    omni_target:
      spec_section: "Omni §9.6"
      file_pattern: "topics/*.topic"
      yaml_path: "filters.<name>"
    default_mapping:
      strategy: omni_control
      summary: "Templated filter type number or timestamp. No min/max constraint; note constraint in description."
      example: |
        filters:
          amount_range:
            type: number
            description: "Range 1000 to 1000000 in steps of 1000"
            display_order: 1
    guardrails_consumed: [parameter_handling]
    failure_mode: warn_and_drop
    verification: "User can enter values inside the documented range."
    notes: "Omni UI does not enforce numeric bounds. Granularity for date stepping emits warning."


    default_mapping:
      strategy: omni_filter
      summary: "Rewrite expression as SQL on a hidden boolean dimension; filter on that dimension."
      example: |
        dimensions:
          high_value_flag:
            sql: CASE WHEN ${TABLE}.amount > 10000 THEN true ELSE false END
            type: yesno
            hidden: true
    guardrails_consumed: []
    failure_mode: best_effort
    verification: "Filtered count matches Tableau."
    notes: "Aggregation reference uses Omni measure-level filters."

  - id: R-FILTER-08
    family: R-FILTER

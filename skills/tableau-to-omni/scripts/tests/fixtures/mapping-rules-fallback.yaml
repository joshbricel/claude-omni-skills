      alt_strategies:
        floating_zone_handling:
          snap_to_grid: dashboard_zone_floating_snap
          preserve_floating: dashboard_zone_floating_snap
          reject_with_warning: drop_with_warning
    guardrails_consumed: [floating_zone_handling]
    failure_mode: best_effort
    notes: "Default snaps floating zones onto the grid; reject_with_warning drops them."


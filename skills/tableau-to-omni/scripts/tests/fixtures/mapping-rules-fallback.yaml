  - id: R-CALC-04
    family: R-CALC
    name: LOD FIXED
    bucket: YELLOW
    tableau_source:
      spec_section: "TWBX §4.3"
    omni_target:
      file_pattern: "views/*.yaml"
      yaml_path: "measures.<name>"
    default_mapping:
      strategy: derived_table_cte
      summary: FIXED LODs map to a CTE with GROUP BY.
      example: "{FIXED [Region] : SUM([Sales])}"
      alt_strategies:
        lod_placement:
          model_layer: derived_table_cte
          workbook_layer: workbook_tile_calc
          snowflake_view: snowflake_view
    guardrails_consumed: [lod_placement]
    failure_mode: warn_and_drop
    notes: ""

  - id: R-CALC-05

version: "1.0"

# Minimal fallback used by tests when the real sidecar has not yet landed.
# Only the rules referenced by the test suite are included. The schema matches
# the contract documented in the apply_rules.py task brief.

guardrails:
  lod_placement:
    default: model_layer
    options: [model_layer, workbook_layer, snowflake_view]
    affects_rules: [R-CALC-04, R-CALC-05, R-CALC-06]
    description: Where to materialize Tableau LOD expressions.
  calculated_field_placement:
    default: model_layer
    options: [model_layer, workbook_layer]
    affects_rules: [R-CALC-01, R-CALC-02, R-CALC-07, R-CALC-08, R-CALC-09]
    description: Where to materialize non-LOD calculated fields.
  floating_zone_handling:
    default: snap_to_grid
    options: [snap_to_grid, preserve_floating, reject_with_warning]
    affects_rules: [R-DASH-04]
    description: How to handle floating dashboard zones.

rules:
  - id: R-CALC-01
    family: R-CALC
    name: Arithmetic and math functions
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §4.1"
      xml_element: column
    omni_target:
      file_pattern: "views/*.yaml"
      yaml_path: "dimensions.<name>"
    default_mapping:
      strategy: model_layer_dimension
    guardrails_consumed: [calculated_field_placement]
    failure_mode: best_effort
    notes: ""

  - id: R-CALC-02
    family: R-CALC
    name: Logical (IF, IIF, CASE)
    bucket: GREEN
    tableau_source:
      spec_section: "TWBX §4.1"
      xml_element: column
    omni_target:
      file_pattern: "views/*.yaml"
      yaml_path: "dimensions.<name>"
    default_mapping:
      strategy: case_when_dimension
    guardrails_consumed: []
    failure_mode: best_effort
    notes: ""

  - id: R-CALC-03
    family: R-CALC
    name: String / date / type functions
    bucket: GREEN
